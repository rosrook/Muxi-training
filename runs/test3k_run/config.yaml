# Post-generation LoRA SFT for Qwen3.5-4B (aligned with Qwen3/examples/llama-factory).
enabled: true
backend: native  # native | llamafactory

# Read-only via symlink under models/ — never write /mnt/public/model/Qwen3.5-4B.
base_model_path: /mnt/public/data/zhuxz/models/Qwen3.5-4B

# Writable training artifacts (defaults when null: checkpoints/<run_id>, runtime_logs/training/<run_id>/tensorboard)
checkpoint_dir: null
tensorboard_log_dir: null

template: qwen
finetuning_type: lora  # lora | qlora | full

lora_rank: 16
lora_alpha: 16
lora_dropout: 0.05
cutoff_len: 1024

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 1.0
warmup_ratio: 0.1
val_size: 0.1
bf16: true
logging_steps: 10
save_steps: 50
seed: 42

# Metax torch often lacks SDPA enable_gqa; eager is the safe default for Qwen3.5 GQA.
attn_implementation: eager

llamafactory_cli: llamafactory-cli
