# Recommended LoRA SFT for ~18k mixed_10k ok samples on Qwen3.5-4B.
# Placed under personal_scaffold — does NOT modify configs/training/*.
#
# Design notes (vs default qwen35_4b_lora.yaml):
# - More data (~18k vs tiny smoke) → lower LR (5e-5) for stability
# - Slightly higher LoRA capacity (r=32, alpha=64) to fit diverse probe patterns
# - 2 epochs: 1 epoch often underfits remediable wrong-item probes at this scale;
#   3+ risks memorizing synthetic artifacts
# - Shorter warmup (3%) because total optimizer steps are large (~2k)
# - save_steps=100 to reduce I/O while still checkpointing regularly
# - cutoff 1024 kept (prior OOM was dirty GPU residual, not sequence length)
# - attn eager required on Metax
enabled: true
backend: native

base_model_path: /mnt/public/data/zhuxz/models/Qwen3.5-4B
checkpoint_dir: null
tensorboard_log_dir: null

template: qwen
finetuning_type: lora

lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
cutoff_len: 1024

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
num_train_epochs: 2.0
warmup_ratio: 0.03
val_size: 0.1
bf16: true
# TensorBoard / console log every N optimizer steps (was 20; smaller = denser curves)
logging_steps: 5
save_steps: 100
seed: 42

attn_implementation: eager

llamafactory_cli: llamafactory-cli
